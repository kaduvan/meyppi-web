<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 40" role="img" aria-label="Meyppi mark">
  <!-- Meyppi mark: continuous audio waveform. Left = source (indigo),
       center = verification (teal, the tallest cluster — the moment of
       truth), right = verified output (indigo). -->
  <g fill="#1B2A4A">
    <rect x="0"  y="15" width="6" height="10" rx="3"/>
    <rect x="8"  y="12" width="6" height="16" rx="3"/>
    <rect x="16" y="8"  width="6" height="24" rx="3"/>
    <rect x="24" y="4"  width="6" height="32" rx="3"/>
    <rect x="32" y="7"  width="6" height="26" rx="3"/>
    <rect x="40" y="11" width="6" height="18" rx="3"/>
    <rect x="48" y="14" width="6" height="12" rx="3"/>
  </g>
  <g fill="#0FA3A3">
    <rect x="56" y="2"  width="6" height="36" rx="3"/>
    <rect x="64" y="6"  width="6" height="28" rx="3"/>
    <rect x="72" y="2"  width="6" height="36" rx="3"/>
  </g>
  <g fill="#1B2A4A">
    <rect x="80" y="14" width="6" height="12" rx="3"/>
    <rect x="88" y="11" width="6" height="18" rx="3"/>
    <rect x="96" y="7"  width="6" height="26" rx="3"/>
    <rect x="104" y="4" width="6" height="32" rx="3"/>
    <rect x="112" y="9" width="6" height="22" rx="3"/>
  </g>
</svg>
